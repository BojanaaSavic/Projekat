<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benchmark biblioteka</title>

<link rel="stylesheet" href="/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/cytoscape@3.34.2/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/@antv/g6@5/dist/g6.min.js"></script>
</head>
<body>
<div class="benchmark-page">

    <h1>Benchmark biblioteka za vizuelizaciju grafa</h1>
    <p class="benchmark-description">
        Benchmark se izvršava nad stvarnim CIM/RDF podacima. Sve biblioteke dobijaju isti graf i iste podatke.
    </p>


    <!-- POSTAVKE BENCHMARKA -->

    <section class="benchmark-controls">
        <div class="benchmark-control">

            <label for="classSelect">
                CIM klasa
            </label>

            <select id="classSelect">
                <option value="">
                    Učitavanje klasa...
                </option>
            </select>

        </div>

        <div class="benchmark-control">
            <label for="resultCount">
                Broj RDF instanci
            </label>

            <input
                type="number"
                id="resultCount"
                min="1"
                value="100"
            >
        </div>

        <div class="benchmark-control">
            <label for="repeatCount">
                Broj ponavljanja
            </label>

            <input
                type="number"
                id="repeatCount"
                min="1"
                value="3"
            >
        </div>

        <div class="benchmark-buttons"> 
            <button id="startBenchmark" class="benchmark-button"> 
                Pokreni benchmark 
            </button> 
            <button id="autoBenchmark" class="benchmark-button"> 
                Automatski benchmark 
            </button> 
            <button id="downloadCSV" class="benchmark-button" disabled> 
                Preuzmi CSV 
            </button> 
        </div>

    </section>

    <section class="benchmark-status">
        <div id="benchmarkStatus">
            Spremno za pokretanje.
        </div>
    </section>

    <section class="benchmark-info">
        <div>
            <strong>Stvarni graf:</strong>
            <span id="graphSource">RealGrid_EQ.ttl</span>
        </div>

        <div>
            <strong>Čvorovi:</strong>
            <span id="nodeCount">-</span>
        </div>

        <div>
            <strong>Veze:</strong>
            <span id="edgeCount">-</span>
        </div>
    </section>

    <section class="benchmark-results">

        <h2>Rezultati</h2>

        <table id="benchmarkTable">

            <thead>

                <tr>
                    <th>Biblioteka</th>
                    <th>Čvorovi</th>
                    <th>Veze</th>
                    <th>Render (s)</th>
                    <th>Layout (s)</th>
                    <th>Ukupno (s)</th>
                </tr>
            </thead>
            <tbody id="benchmarkResults">
            </tbody>
        </table>
    </section>

    <section class="benchmark-render-area">
        <div
            id="d3BenchmarkContainer"
            class="benchmark-container">
        </div>

        <div
            id="cytoscapeBenchmarkContainer"
            class="benchmark-container">
        </div>

        <div
            id="sigmaBenchmarkContainer"
            class="benchmark-container">
        </div>

        <div
            id="g6BenchmarkContainer"
            class="benchmark-container">
        </div>
    </section>
</div>

<script type="module" src="/benchmark.js"></script>

</body>
</html>
