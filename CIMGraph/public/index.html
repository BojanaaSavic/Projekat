<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>CIM RDF Explorer</title>
    <link
        rel="stylesheet"
        href="/style.css"
    >
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/cytoscape@3.34.2/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/@antv/g6@5/dist/g6.min.js"></script>
</head>
<body>
<header>
    <h1>CIM RDF Explorer</h1>
    <p>
        Generička vizuelizacija CIM/RDF modela
    </p>
</header>
<main>
    <!-- IZBOR TIPA PRIKAZA -->

    <section class="card">

        <h2>1. Izbor prikaza</h2>

        <label for="graphTypeSelect">
            Prikaz:
        </label>

        <select id="graphTypeSelect">

            <option value="">
                -- Izaberi prikaz --
            </option>

            <option value="instances">
                Instance po klasi
            </option>

            <option value="groups">
                Grupe
            </option>

        </select>
        <br><br>

        <label for="graphLibrarySelect">
            Biblioteka za prikaz grafa:
        </label>

        <select id="graphLibrarySelect">

            <option value="d3">
                D3.js
            </option>

            <option value="cytoscape">
                Cytoscape.js
            </option>

            <option value="sigma">
                Sigma.js
            </option>

            <option value="g6">
                G6
            </option>
        </select>

    </section>

    <!-- IZBOR KLASE -->

    <section
        id="classSection"
        class="card hidden"
    >

        <h2>2. Izbor klase</h2>

        <label for="classSelect">
            Klasa:
        </label>

        <select id="classSelect">

            <option value="">
                -- Izaberi klasu --
            </option>

        </select>

    </section>

    <!-- IZBOR PROPERTY-JA -->

    <section
        id="propertySection"
        class="card hidden"
    >

        <h2>3. Izbor relacije</h2>

        <label for="propertySelect">
            Relacija:
        </label>

        <select id="propertySelect">

            <option value="">
                -- Izaberi relaciju --
            </option>

        </select>

        <p id="propertyDescription"></p>

    </section>

    <!-- GRUPE -->

    <section
        id="groupSection"
        class="card hidden"
    >
        <h2>4. Grupe</h2>

        <div id="groups"></div>

    </section>

    <!-- GRAF -->

    <section
        id="graphSection"
        class="card hidden"
    >

        <h2 id="graphTitle">
            Graf povezanosti
        </h2>

        <div class="graph-info">

            <span>
                Čvorovi:
                <strong id="nodeCount">0</strong>
            </span>

            <span>
                Veze:
                <strong id="edgeCount">0</strong>
            </span>

        </div>

        <div
            id="graphContainer"
            class="graph-container"
        ></div>

    </section>

    <!-- STATUS -->

    <section
        id="status"
        class="status"
    >
        Učitavanje RDF modela...

    </section>
</main>
<script type="module">

import { D3Graph } from '/d3Graph.js';
import { CytoscapeGraph } from '/cytoscapeGraph.js';
import { SigmaGraph } from '/sigmaGraph.js';
import { G6Graph } from '/g6Graph.js';

const graphTypeSelect = document.getElementById('graphTypeSelect');
const graphLibrarySelect = document.getElementById('graphLibrarySelect');
const classSelect = document.getElementById('classSelect');
const propertySelect = document.getElementById('propertySelect');
const classSection = document.getElementById('classSection');
const propertySection = document.getElementById('propertySection');
const groupSection = document.getElementById('groupSection');
const groups = document.getElementById('groups');
const propertyDescription = document.getElementById('propertyDescription');
const graphSection = document.getElementById('graphSection');
const graphTitle = document.getElementById('graphTitle');
const graphContainer = document.getElementById('graphContainer');
const d3Graph = new D3Graph(graphContainer);
const cytoscapeGraph = new CytoscapeGraph(graphContainer);
const sigmaGraph = new SigmaGraph(graphContainer);
const g6Graph = new G6Graph(graphContainer);
const nodeCount = document.getElementById('nodeCount');
const edgeCount = document.getElementById('edgeCount');
const status = document.getElementById('status');

const graphRenderers = {
    d3: d3Graph,
    cytoscape: cytoscapeGraph,
    sigma: sigmaGraph,
    g6: g6Graph
};

// UČITAVANJE KLASA

async function loadClasses() {
    try {
        const response = await fetch('/api/classes');
        const classes = await response.json();

        classSelect.innerHTML = `
            <option value="">
                -- Izaberi klasu --
            </option>
        `;

        classes.forEach(cimClass => {
            const option = document.createElement('option');
            option.value = cimClass.uri;
            option.textContent = cimClass.name;
            classSelect.appendChild(option);
        });

        status.textContent = `Učitano ${classes.length} klasa.`;
    }
    catch (error) {
        console.error(error);
        status.textContent = 'Greška prilikom učitavanja klasa.';
    }
}

// UČITAVANJE GRAFA

let currentGraph = null;

async function loadGraph(url, title) {

    try {

        status.textContent = 'Učitavanje grafa...';

        const response = await fetch(url);

        if (!response.ok) {

            const error = await response.json();
            throw new Error(error.error || 'Greška prilikom učitavanja grafa.');
        }

        const graph = await response.json();
        currentGraph = graph;

        nodeCount.textContent = graph.nodes.length;
        edgeCount.textContent = graph.edges.length;
        graphTitle.textContent = title;
        graphSection.classList.remove('hidden');

        renderCurrentGraph();

        status.textContent = `Graf učitan: ${graph.nodes.length} čvorova i ${graph.edges.length} veza.`;
    }
    catch (error) {
        console.error(error);
        graphSection.classList.add('hidden');
        status.textContent = `Greška: ${error.message}`;
    }
}

async function handleNodeDoubleClick(node) {

    if (!node || !node.id) {
        return;
    }

    await loadGraph(
        `/api/graph?type=equipment&container=${encodeURIComponent(node.id)}`,
        `Oprema kontejnera: ${node.name || node.id}`
    );
}

function renderCurrentGraph() {

    if (!currentGraph) {
        return;
    }

    const library = graphLibrarySelect.value;
    const renderer = graphRenderers[library];

    if (!renderer) {
        console.error(`Nepoznata biblioteka za prikaz: ${library}`);
        return;
    }

    Object.values(graphRenderers).forEach(
        currentRenderer => {
            if (currentRenderer !== renderer) {
                currentRenderer.clear();
            }

        }
    );

    renderer.render(currentGraph, handleNodeDoubleClick);
}

graphLibrarySelect.addEventListener('change', function () {

        if (!currentGraph) {
            return;
        }
        renderCurrentGraph();
    }
);

// IZBOR TIPA GRAFA

graphTypeSelect.addEventListener('change', async function () {
        const type = this.value;

        graphSection.classList.add('hidden');
        classSection.classList.add('hidden');
        propertySection.classList.add('hidden');
        groupSection.classList.add('hidden');
        groups.innerHTML = '';

        // INSTANCE PO KLASI

        if (type === 'instances') {
            classSection.classList.remove('hidden');
            status.textContent = 'Izaberite klasu.';
        }

        // GRUPE

        if (type === 'groups') {
            classSection.classList.remove('hidden');
            status.textContent = 'Izaberite klasu.';
        }
    }
);

// IZBOR KLASE

classSelect.addEventListener('change', async function () {
        const classUri = this.value;

        propertySelect.innerHTML = `
            <option value="">
                -- Izaberi relaciju --
            </option>
        `;

        groups.innerHTML = '';
        groupSection.classList.add('hidden');

        if (!classUri) {
            propertySection.classList.add('hidden');
            graphSection.classList.add('hidden');

            return;
        }

        const type = graphTypeSelect.value;

        // INSTANCE PO KLASI

        if (type === 'instances') {
            await loadGraph(
                `/api/graph?type=instances&class=${encodeURIComponent(classUri)}`,
                `Instance klase: ${this.options[this.selectedIndex].textContent}`
            );
            return;
        }

        // GRUPE

        if (type === 'groups') {
            try {
                status.textContent = 'Učitavanje relacija...';

                const response = await fetch(`/api/properties?class=${encodeURIComponent(classUri)}`);
                const properties = await response.json();

                properties.forEach(property => {
                    const option = document.createElement('option');

                    option.value = property.uri;
                    option.textContent = property.name;
                    option.dataset.comment = property.comment || '';

                    propertySelect.appendChild(option);
                });

                propertySection.classList.remove('hidden');

                status.textContent = `Pronađeno ${properties.length} relacija.`;

            }
            catch (error) {
                console.error(error);
                status.textContent = 'Greška prilikom učitavanja relacija.';
            }
        }
    }
);

// IZBOR PROPERTY-JA

propertySelect.addEventListener('change', async function () {
        const propertyUri = this.value;
        const classUri = classSelect.value;

        groups.innerHTML = '';
        groupSection.classList.add('hidden');

        if (!propertyUri || !classUri) {
            return;
        }

        const selectedOption = this.options[this.selectedIndex];

        propertyDescription.textContent = selectedOption.dataset.comment || '';

        try {
            status.textContent = 'Grupisanje podataka...';

            const response = await fetch(
                `/api/group?class=${encodeURIComponent(classUri)}&property=${encodeURIComponent(propertyUri)}`);
            const data = await response.json();

            if (!Array.isArray(data) || data.length === 0
            ) {
                groups.innerHTML = '<p>Nema podataka za izabranu relaciju.</p>';
                groupSection.classList.remove('hidden');
                status.textContent = 'Nema podataka za grupisanje.';

                return;
            }

            data.forEach(group => {
                const groupElement = document.createElement('div');

                groupElement.className = 'group';

                groupElement.addEventListener('click', async function () {
                        await loadGraph(
                            `/api/graph?type=groups&class=${encodeURIComponent(classUri)}&property=${encodeURIComponent(propertyUri)}&group=${encodeURIComponent(group.uri)}`,
                            `Graf grupe: ${group.name}`
                        );
                    }
                );

                const title = document.createElement('h3');
                title.textContent = group.name;
                const type = document.createElement('p');

                if (group.type) {
                    type.textContent = `Tip: ${group.type}`;
                }

                const list = document.createElement('div');

                group.items.forEach(item => {
                    const element = document.createElement('div');

                    element.className = 'group-item';
                    element.textContent = item.name;
                    list.appendChild(element);
                });

                groupElement.appendChild(title);

                if (group.type) {
                    groupElement.appendChild(type);
                }

                groupElement.appendChild(list);
                groups.appendChild(groupElement);
            });

            groupSection.classList.remove('hidden');

            status.textContent = `Pronađeno ${data.length} grupa. Kliknite na grupu za prikaz njenog grafa.`;
        }
        catch (error) {
            console.error(error);
            status.textContent = 'Greška prilikom grupisanja podataka.';
        }
    }
);

loadClasses();

</script>
</body>
</html>
